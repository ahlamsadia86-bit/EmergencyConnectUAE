<!DOCTYPE html>
<html>
<head>
    <title>EmergencyConnectUAE Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>

<div class="login-card">
    <h3 class="text-center mb-2 brand">EmergencyConnectUAE</h3>
    <p class="text-center text-muted mb-4">Secure Emergency Coordination Platform</p>

    <div class="mb-3">
    <label>Email</label>
    <input id="email" class="form-control" placeholder="Enter email">
</div>

<div class="mb-3">
    <label>Password</label>
    <input id="password" type="password" class="form-control" placeholder="Enter password">
</div>

    <button onclick="login()" class="btn btn-primary w-100">Login</button>

    <div id="message" class="mt-3 text-center"></div>
</div>

<script>
async function login() {

    document.getElementById("message").innerHTML = "";

    try {

        const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            })
        });

        const data = await response.text();

        if (!response.ok) {

            let errorMessage = "Invalid email or password";

            try {
                const errorJson = JSON.parse(data);

                if (errorJson.message) {
                    errorMessage = errorJson.message;
                }

            } catch (e) {
                // keep default message
            }

            document.getElementById("message").innerHTML =
                `<div class="alert alert-danger mt-3">
                    <strong>Login Failed</strong><br>
                    ${errorMessage}
                </div>`;

            return;
        }

        if (data.includes("MFA required")) {

            const code = data.match(/\d{6}/)[0];

            localStorage.setItem("mfaEmail", document.getElementById('email').value);
            localStorage.setItem("demoMfaCode", code);

            alert("Your demo MFA code is: " + code);

            window.location.href = "/mfa";

        } else {

            const json = JSON.parse(data);

            localStorage.setItem("jwt", json.token);
            localStorage.setItem("role", json.role);
            localStorage.setItem("email", document.getElementById('email').value);

            window.location.href = "/dashboard";
        }

    } catch (error) {

        document.getElementById("message").innerHTML =
            `<div class="alert alert-danger mt-3">
                <strong>System Error</strong><br>
                Unable to contact server.
            </div>`;
    }
}
</script>

</body>
</html>
