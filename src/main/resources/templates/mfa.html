<!DOCTYPE html>
<html>
<head>
    <title>MFA Verification</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>

<div class="login-card">
    <h3 class="text-center brand">MFA Verification</h3>
    <p class="text-center text-muted">Enter the dispatcher/admin verification code.</p>

    

    <div class="mb-3">
        <label>MFA Code</label>
        <input id="code" class="form-control">
    </div>

    <button onclick="verifyMfa()" class="btn btn-success w-100">Verify</button>

    <div id="message" class="mt-3 text-center"></div>
</div>

<script>
document.getElementById("demoCode").innerText =
    localStorage.getItem("demoMfaCode");

document.getElementById("code").value =
    localStorage.getItem("demoMfaCode");

async function verifyMfa() {

    const response = await fetch('/api/auth/verify-mfa', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            email: localStorage.getItem("mfaEmail"),
            code: document.getElementById('code').value
        })
    });

    if (response.ok) {

        const data = await response.json();

        localStorage.setItem("jwt", data.token);
        localStorage.setItem("role", data.role);

        // ADDED
        localStorage.setItem("email", localStorage.getItem("mfaEmail"));

        window.location.href = "/dashboard";

    } else {

        document.getElementById("message").innerHTML =
            "<span class='text-danger'>Invalid MFA code</span>";
    }
}
</script>
</body>
</html>
