# ===============================
# Application
# ===============================
spring.application.name=EmergencyConnectUAE
server.port=8080

# ===============================
# MySQL Database
# ===============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/emergencyconnectuae?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Redis Configuration
# ===============================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Redis session storage
spring.session.store-type=redis
spring.session.redis.namespace=emergencyconnectuae:session
server.servlet.session.timeout=30m
spring.data.redis.repositories.enabled=false

# ===============================
# JWT Configuration
# ===============================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS}

# ===============================
# Swagger
# ===============================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ===============================
# Actuator / Health Checks
# ===============================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ===============================
# Security Demo Settings
# ===============================
app.security.allowed-origin=http://localhost:8080
app.security.rate-limit-per-minute= 20000


server.ssl.enabled=${SSL_ENABLED:false}
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=springboot